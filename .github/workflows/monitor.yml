name: Monitor and publish official press releases
on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pharma-press-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python validate.py
      - name: Check all official sources
        id: check
        env:
          PAGES_URL: https://seijiwa.github.io/pharma-press-monitor
        run: |
          rm -f data/status.json docs/status.json
          result=0
          python -u run.py || result=$?
          # Exit 2 means a completed collection with source failures.
          case "$result" in
            0|2) ;;
            *) exit "$result" ;;
          esac
      - name: Validate RSS and health output
        id: validate_output
        run: |
          python - <<'PY'
          import csv, json, pathlib, xml.etree.ElementTree as ET
          with open('companies.csv', encoding='utf-8-sig', newline='') as watchlist:
              companies = {row['Company'] for row in csv.DictReader(watchlist)}
          status = json.loads(pathlib.Path('data/status.json').read_text())
          public_status = json.loads(pathlib.Path('docs/status.json').read_text())
          assert len(companies) == 71 and status.keys() == companies
          assert status == public_status
          ET.parse('docs/feed.xml')
          feeds = list(pathlib.Path('docs/feeds').glob('*.xml'))
          assert len(feeds) == 71
          for feed in feeds:
              ET.parse(feed)
          print('PASS: 71 statuses and 72 valid RSS files')
          PY
      - name: Save monitor history
        run: |
          git config user.name 'pharma-press-monitor[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ docs/
          if ! git diff --cached --quiet; then
            git commit -m 'Update official press release monitor'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              if ! git diff --quiet HEAD^ FETCH_HEAD -- data/ docs/; then
                echo '::error::Concurrent monitor data update; refusing to overwrite'
                exit 1
              fi
              if ! git rebase FETCH_HEAD; then
                git rebase --abort
                exit 1
              fi
            done
            echo '::error::Monitor publication retries exhausted'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Wait for uploaded Pages artifact to become visible
        id: pages_artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Poll the exact run until the upload is visible to the deployment API.
          for attempt in $(seq 1 12); do
            if gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false and .size_in_bytes > 0) | .id' > "$RUNNER_TEMP/pages-artifact-ids"; then
              if grep -Eq '^[0-9]+$' "$RUNNER_TEMP/pages-artifact-ids"; then
                echo "Pages artifact is visible (attempt $attempt)."
                exit 0
              fi
            fi
            echo "Pages artifact not visible yet (attempt $attempt/12)."
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::Uploaded Pages artifact not visible in this run after bounded wait; saved audit remains available."
          exit 1
      - name: Publish site and RSS
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source failures independently of Pages
        if: always() && steps.validate_output.outcome == 'success'
        run: |
          python - <<'PY'
          import json, os, sys
          s=json.load(open('data/status.json'))
          failed={k:v for k,v in s.items() if v['status']!='OK'}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Source health: '+str(71-len(failed))+'/71 OK'+chr(10)+chr(10))
              for k,v in failed.items(): f.write('- '+k+': '+v['detail']+chr(10))
          sys.exit(1 if failed else 0)
          PY
