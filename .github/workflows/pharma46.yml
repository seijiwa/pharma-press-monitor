name: Pharma46 - dated official news audit (v2.2 staged cutover)

on:
  push:
    branches: [main]
    paths:
      - 'pharma46/**'
      - 'tests_pharma46/**'
      - 'requirements-pharma46.txt'
      - '.github/workflows/pharma46.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pharma46/**'
      - 'tests_pharma46/**'
      - 'scripts/pharma71_delivery_lock.py'
      - '.github/workflows/pharma46*.yml'
  workflow_dispatch:
  schedule:
    # 04:07 JST daily; non-hour boundary reduces scheduler congestion.
    - cron: '7 19 * * *'

permissions:
  contents: write

concurrency:
  group: pharma46-${{ github.event_name == 'pull_request' && github.ref || 'daily' }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve main when this serialized job actually starts, not its queued push SHA.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - name: Record checked-out revision
        run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install fixed dependencies
        run: pip install -r requirements-pharma46.txt pytest==8.4.2
      - name: Install supported Chromium
        continue-on-error: true
        run: python -m playwright install --with-deps chromium
      - name: Run fixture and schema tests before live collection
        run: python -m pytest tests_pharma46/ -q
      - name: Collect all 46 directly (no mail)
        id: collect
        continue-on-error: true
        run: python -m pharma46.cli --workers 4 --max-pages 12
      - name: Upload full raw HTML evidence and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharma46-evidence-${{ github.run_id }}
          path: |
            data/evidence/
            data/pharma_monitor_*_batch_*.json
            data/pharma_monitor_*_audit.json
            data/pharma_monitor_*_report.md
          retention-days: 30
          if-no-files-found: warn
      - name: Commit audit data and verified baselines
        if: steps.collect.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'pharma46-monitor[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pharma46_state.json data/pharma_monitor_*_batch_*.json data/pharma_monitor_*_audit.json data/pharma_monitor_*_report.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record evidence-based pharma46 audit'
            if ! git pull --rebase origin main; then
              git rebase --abort
              echo 'Audit artifact retained; concurrent repository update prevented safe baseline persistence.' >&2
              exit 1
            fi
            git push origin HEAD:main
          fi
      - name: Mark incomplete audits as failed
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          now = datetime.now(timezone(timedelta(hours=9)))
          audit=Path('data')/f'pharma_monitor_{now.date().isoformat()}_audit.json'
          if not audit.exists():
              print('FAIL: collection did not produce an audit file');sys.exit(2)
          data=json.loads(audit.read_text())
          print('Coverage:',data['summary']['period_verified'],'/46; unconfirmed:',data['summary']['unconfirmed'])
          print('Email:',data.get('delivery',{}).get('status'))
          if os.getenv('COLLECT_OUTCOME')!='success' or data.get('run_id')!=os.getenv('GITHUB_RUN_ID') or data['qa_errors']:sys.exit(2)
          if data['summary']['period_verified'] != 46:
              print('::warning::Pharma46 coverage NOT READY')
              if os.getenv('GITHUB_EVENT_NAME')!='pull_request':sys.exit(2)
              sys.exit(2)
          PY
