name: Pharma71 morning email
on:
  schedule:
    - cron: '11 20 * * *'
    - cron: '21 20 * * *'
    - cron: '27 20 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/pharma71_email.py'
      - 'scripts/pharma71_unified_mail.py'
      - 'scripts/pharma71_delivery_lock.py'
      - 'tests_mail/**'
      - '.github/workflows/pharma71-email.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or send one test message to the configured Gmail account
        type: choice
        options:
          - preview
          - test
        default: preview
permissions:
  contents: write
concurrency:
  group: pharma71-morning-email-${{ github.event_name == 'schedule' && 'daily' || 'verification' }}
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read latest unified audit (supplement only)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: pharma71-unified-20261127
          path: unified-staging
          persist-credentials: false
      - name: Test mail audit freshness and scope
        if: github.event_name != 'schedule'
        run: python3 -m unittest discover -s tests_mail -q
      - name: Verify actual GitHub reservation collision (no mail)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=scripts python3 -c 'from pharma71_delivery_lock import live_probe; live_probe()'
      - name: SMTP authentication smoke test (no email)
        if: github.event_name == 'push'
        env:
          PHARMA71_GMAIL_USER: ${{ secrets.PHARMA71_GMAIL_USER }}
          PHARMA71_GMAIL_APP_PASSWORD: ${{ secrets.PHARMA71_GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl
          address=os.environ.get('PHARMA71_GMAIL_USER','').strip()
          password=''.join(os.environ.get('PHARMA71_GMAIL_APP_PASSWORD','').split())
          if not address or not password:raise SystemExit('SMTP credentials unavailable')
          try:
              with smtplib.SMTP('smtp.gmail.com',587,timeout=20) as smtp:
                  smtp.starttls(context=ssl.create_default_context())
                  smtp.ehlo()
                  smtp.user,smtp.password=address,password
                  smtp.auth('LOGIN',smtp.auth_login,initial_response_ok=False)
              print('SMTP_AUTH_PASS: authentication only, no email sent')
          except Exception as exc:
              raise SystemExit('SMTP_AUTH_FAILED: '+type(exc).__name__) from None
          PY
      - name: Prepare or deliver report
        env:
          DELIVERY_MODE: ${{ github.event_name == 'schedule' && 'daily' || inputs.mode || 'preview' }}
          GH_TOKEN: ${{ github.token }}
          PHARMA71_GMAIL_USER: ${{ secrets.PHARMA71_GMAIL_USER }}
          PHARMA71_GMAIL_APP_PASSWORD: ${{ secrets.PHARMA71_GMAIL_APP_PASSWORD }}
        run: python3 scripts/pharma71_email.py "$DELIVERY_MODE"
