name: Pharma71 morning email
on:
  schedule:
    - cron: '21 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or send one test message to the configured Gmail account
        type: choice
        options:
          - preview
          - test
        default: preview
permissions:
  contents: write
concurrency:
  group: pharma71-morning-email
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Read latest unified audit (supplement only)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: pharma71-unified-20261127
          path: unified-staging
          persist-credentials: false
      - name: Test mail audit freshness and scope
        run: python3 -m unittest discover -s tests_mail -q
      - name: Prepare or deliver report
        env:
          DELIVERY_MODE: ${{ github.event_name == 'schedule' && 'daily' || inputs.mode }}
          GH_TOKEN: ${{ github.token }}
          PHARMA71_GMAIL_USER: ${{ secrets.PHARMA71_GMAIL_USER }}
          PHARMA71_GMAIL_APP_PASSWORD: ${{ secrets.PHARMA71_GMAIL_APP_PASSWORD }}
        run: python3 scripts/pharma71_email.py "$DELIVERY_MODE"
