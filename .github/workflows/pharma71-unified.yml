name: Pharma71 unified audit - staging
on:
  push:
    branches: [pharma71-unified-20261127]
    paths:
      - 'pharma46/**'
      - 'pharma71_unified/**'
      - 'tests_pharma71_unified/**'
      - '.github/workflows/pharma71-unified.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pharma71-unified-staging
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-pharma46.txt pytest==8.4.2
      - name: Offline tests
        run: python -m pytest tests_pharma46 tests_pharma71_unified -q
      - name: Install Chromium
        continue-on-error: true
        run: python -m playwright install --with-deps chromium
      - name: Live audit 71 (no email)
        id: collect
        run: python -m pharma71_unified.cli --workers 3 --max-pages 12
      - name: Preserve report, original receipts and verified RSS
        if: always() && steps.collect.outcome != 'skipped' && steps.collect.outcome != ''
        uses: actions/upload-artifact@v4
        with:
          name: pharma71-unified-evidence-${{ github.run_id }}
          path: data/pharma71_unified/
          if-no-files-found: warn
          retention-days: 30
      - name: Persist staging baselines and verified RSS (no production change)
        if: steps.collect.outcome == 'success' && github.ref == 'refs/heads/pharma71-unified-20261127' && !cancelled()
        run: |
          git config user.name 'pharma71-staging[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/pharma71_unified/state.json data/pharma71_unified/verified_original_history.json data/pharma71_unified/audit.json data/pharma71_unified/report.md data/pharma71_unified/feeds/
          if ! git diff --cached --quiet; then
            git commit -m 'Persist staging audit and verified release history'
            git pull --rebase origin pharma71-unified-20261127
            git push origin HEAD:pharma71-unified-20261127
          fi
      - name: Require complete coverage and current audit
        if: steps.collect.outcome == 'success' && !cancelled()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path('data/pharma71_unified/audit.json').read_text())
          assert a['run_id']==os.environ['GITHUB_RUN_ID']
          assert len(a['entries'])==71
          print(a['summary'])
          assert a['qa_pass'], 'Incomplete period coverage'
          PY
